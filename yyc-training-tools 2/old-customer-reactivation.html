<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YYC 老客户唤醒电话助手</title>
<style>
  :root{
    --navy:#1d3f72;
    --navy-dark:#16305a;
    --blue-soft:#eaf2fc;
    --gray-bg:#eef1f5;
    --border:#e3e7ee;
    --text:#1f2430;
    --sub:#6b7386;
    --green:#1f9d55;
    --amber:#b9860a;
    --red:#c23b3b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:30px 14px 60px;
    background:#dde3ec;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(20,30,60,.18);
  }
  .header{
    background:linear-gradient(135deg,var(--navy),var(--navy-dark));
    color:#fff;
    padding:20px 20px 18px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .header h1{
    margin:0;
    font-size:22px;
    line-height:1.3;
    font-weight:800;
  }
  .header h1 .h1-sub{
    display:block;
    font-size:13px;
    font-weight:600;
    color:#c9d6ea;
    margin-top:5px;
  }
  .header .tag{
    text-align:right;
    font-size:13px;
    color:#c9d6ea;
    line-height:1.5;
    white-space:nowrap;
    padding-top:2px;
  }
  .track-bar{
    background:var(--gray-bg);
    padding:14px 20px 16px;
  }
  .track-label{
    font-size:12px;
    font-weight:800;
    color:#8a93a3;
    letter-spacing:.5px;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .track-row{display:flex;gap:10px;}
  .track-card{
    flex:1;
    background:#fff;
    color:var(--navy);
    box-shadow:0 2px 8px rgba(20,30,60,.10);
    font-size:14px;
    font-weight:700;
    text-align:center;
    line-height:1.4;
    padding:14px 10px;
    border-radius:12px;
    cursor:default;
  }

  .content{padding:0;}

  .transcript{
    padding:20px 20px 6px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .t-row{display:flex;}
  .t-row.out{justify-content:flex-end;}
  .t-row.in{justify-content:flex-start;}
  .t-bubble{
    max-width:82%;
    padding:14px 18px;
    border-radius:14px;
    font-size:15.5px;
    line-height:1.65;
  }
  .t-bubble.script{
    background:linear-gradient(135deg,var(--navy),var(--navy-dark));
    color:#fff;
  }
  .t-bubble.script b{color:#ffd76a;}
  .t-bubble.script i{color:#cfe0f5;}
  .t-bubble.client{
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:24px;
    color:#242a38;
    font-weight:700;
    font-size:14.5px;
    padding:12px 18px;
  }
  .t-terminal{padding:8px 6px 4px;}

  .live-zone{padding:4px 20px 4px;}
  .resp-label{
    font-size:12.5px;
    font-weight:800;
    color:#8990a1;
    letter-spacing:.4px;
    margin-bottom:12px;
    text-transform:uppercase;
  }
  .resp-label .step-tag{
    color:#a9b0bd;
    font-weight:700;
    text-transform:none;
    letter-spacing:0;
    margin-left:6px;
  }
  .resp-wrap{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:6px;
  }
  .resp-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:24px;
    padding:13px 20px;
    font-size:15.5px;
    font-weight:700;
    color:#242a38;
    cursor:pointer;
    text-align:center;
    line-height:1.4;
    transition:border-color .15s ease, background .15s ease;
  }
  .resp-btn:hover{border-color:var(--navy);background:#f6f9fd;}
  .resp-btn.accept{border-color:#bfe3cc;}
  .resp-btn.accept:hover{border-color:var(--green);}

  .continue-btn{
    width:100%;
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:16px 18px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    margin-top:8px;
  }
  .continue-btn:hover{background:var(--navy-dark);}

  .terminal-icon{font-size:40px;text-align:center;margin-bottom:8px;}
  .terminal-title{
    text-align:center;
    font-size:19px;
    font-weight:800;
    margin-bottom:10px;
  }
  .terminal-note{
    text-align:center;
    font-size:14.5px;
    color:var(--sub);
    line-height:1.65;
    margin-bottom:6px;
  }

  .bottom-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:16px 20px 18px;
    border-top:1px solid var(--border);
    margin-top:10px;
  }
  .quick-toggle-inline{
    font-size:13.5px;
    font-weight:800;
    color:#8a6400;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .quick-toggle-inline:hover{color:#b9860a;}
  .restart-inline{
    text-align:right;
    font-size:13.5px;
    font-weight:700;
    color:#8990a1;
    cursor:pointer;
  }
  .restart-inline:hover{color:var(--navy);}

  .quick-list{
    max-height:0;
    overflow:hidden;
    transition:max-height .4s ease;
    padding:0 20px;
  }
  .quick-list.open{max-height:3000px;padding-bottom:16px;}
  .quick-item{
    background:#fffaf0;
    border:1px solid #f3e3bd;
    border-radius:10px;
    padding:12px 14px;
    margin-top:8px;
    font-size:14px;
    line-height:1.6;
  }
  .quick-item .q{font-weight:800;color:#5a4200;margin-bottom:4px;}
  .quick-item .a{color:#4a4636;}

  .back-row{padding:0 20px;min-height:22px;}
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:12.5px;
    font-weight:700;
    color:#5b6b8c;
    cursor:pointer;
    padding:8px 0 0;
  }
  .back-link:hover{color:var(--navy);}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>老客户唤醒 / 服务推荐<span class="h1-sub">*Academy Re-engagement Calling Script</span></h1>
    <div class="tag">上过课 / 询问过<br>已是客户</div>
  </div>

  <div class="track-bar">
    <div class="track-label">通话类型 / TRACK</div>
    <div class="track-row">
      <div class="track-card">老客户唤醒 / 服务推荐</div>
    </div>
  </div>

  <div class="content" id="content">
    <div class="transcript" id="transcript"></div>
    <div class="back-row" id="backRow"></div>
    <div class="live-zone" id="liveZone"></div>
  </div>

  <div class="quick-list" id="quickList"></div>

  <div class="bottom-bar">
    <div class="quick-toggle-inline" id="quickToggleInline" onclick="toggleQuick()" style="display:none;">⚡ 快速问答</div>
    <div class="restart-inline" onclick="restart()">↺ 重新开始</div>
  </div>
</div>

<script>
const TOTAL_STEPS = 5;

const nodes = {
  OPEN:{
    step:1,
    section:"开场破冰",
    script:`Hello 请问是 <b>[xxx]</b> 吗？你好，我是<b>[XXX]</b> from YYC，请问方便讲电话吗？很快的！`,
    responses:[
      {label:"Yes", next:"RECONNECT"},
      {label:"No", handling:"方便大概几点打回给你？", next:"CALLBACK"}
    ]
  },
  RECONNECT:{
    step:2,
    section:"确认之前关系",
    script:`我这里看到之前你有inquiry过我们的服务的，你还记得吗？（停顿聆听）那我的同事有帮到你吗？还是你已经是engaged了我们的服务了。`,
    responses:[
      {label:"记得，同事有帮到我", handling:"那很好！我是负责Academy的部门，我叫<b>[XXXX]</b>；那我今天打过来，主要是想跟你update一下，我们最近有推出新的免费课程和一些服务，看适不适合您现在的需求。", next:"COURSE_PITCH"},
      {label:"记得，但好像没什么人跟进 / 没帮到", handling:"啊！对不起咧，那我可以帮到你吗。请问你需要我们什么服务呢？", next:"SERVICE_PITCH"},
      {label:"有，我已经是你们的客户了", handling:"明白，那很好！既然你已经是我们的客户，我是负责Academy的部门，我叫<b>[XXXX]</b>，我这次打来是想跟你分享新的课程，都是我们Datin Shin亲自分享的哦，我可以跟你分享分享吗？", next:"COURSE_PITCH"},
      {label:"不记得了 / 没什么印象", handling:"没关系，我是负责Academy的部门，我叫<b>[XXXX]</b>，我今天打来主要是想跟你分享一下我们最近的免费课程，都是我们Datin Shin亲自分享的哦，我可以跟你分享分享吗？", next:"COURSE_PITCH"}
    ]
  },
  COURSE_PITCH:{
    step:3,
    section:"Step A · 课程推荐",
    script:`我们最近有两个免费的线上课程的，<br>第1是：「传承与买卖M&A」<br>第2是：「现金流管理」<br><br>我都可以帮你报名的，可以吗？`,
    responses:[
      {label:"可以 / OK / 再看吧", next:"COURSE_REGISTER"},
      {label:"暂时不用", next:"SERVICE_PITCH"},
      {label:"讲什么的哦？", handling:"首先《传承与买卖公司 / M&A》Datin Shin亲自教你<br>✅ 8个步骤怎样并购（M&A）或把公司卖出好价钱（Valuation）。<br>✅ 如何顺利把企业传承给下一代？<br><br>那「现金流管理」Datin Shin亲自教你<br>✅ 用你公司真实的Data跟着我们的方式计算公司的CCC和Working Capital<br>✅ 我们教你怎样算公司的现金流状况<br><br>是在线上Zoom的哦，而且是免费的，帮你报名OK吗？", next:"COURSE_PITCH_CONFIRM"}
    ]
  },
  COURSE_PITCH_CONFIRM:{
    step:3,
    section:"Step A · 课程推荐（确认）",
    script:`那要帮你报名吗？`,
    responses:[
      {label:"可以 / OK", next:"COURSE_REGISTER"},
      {label:"暂时不用", next:"SERVICE_PITCH"}
    ]
  },
  COURSE_REGISTER:{
    step:4,
    section:"课程报名资料",
    script:`我们的《传承与买卖公司》是在<b>(X)月（X)日 下午2pm</b>。那「现金流管理」是在<b>(X)月（X)日 X pm</b>。我需要你跟你confirm一下然后报名哦。<br><br>公司名字：<i>跟客户核对显示的公司名称</i><br>Email address：<i>跟客户核对是否已有，没有的话现在问</i>`,
    responses:[
      {label:"资料确认，完成登记", next:"SERVICE_PITCH"}
    ]
  },
  SERVICE_PITCH:{
    step:5,
    section:"Step B · 服务推荐",
    script:`好的！那另外，我们这边也可以在几方面帮到您：<br>✅ Audit / Tax（公司的审计和报税）一个好的Auditor&Tax Agent是很重要的<br>✅ 想要解决股东问题 / 现金流问题<br>✅ 还是其他Tax相关的课程<br><br>不知道您现在比较想先了解哪一个？`,
    responses:[
      {label:"想了解 Audit / Tax", handling:"好的，那这个我可以请我们的同事跟见面讲解更多关于我们的报价和我们的服务内容，OK吗？", next:"FOLLOWUP_SERVICE"},
      {label:"想要解决股东问题 / 现金流问题", next:"COURSE_PITCH"},
      {label:"还是其他Tax相关的课程", handling:"好的，我们这边有几个不同的Tax课程，有SST的，Stamp Duty的，Einvoice的，你看比较想了解哪一方面的问题呢？", next:"TAX_FOLLOWUP"},
      {label:"都不需要", handling:"没关系，你可以先把我号码存起来先，之后有新课程或者有最新消息再通知你咯。", next:"SOFT_CLOSE"}
    ]
  },
  TAX_FOLLOWUP:{
    step:5,
    section:"Tax课程细分",
    script:`好的，那这个我可以请我们的同事跟见面讲解更多关于我们的报价和我们的服务内容，OK吗？`,
    responses:[
      {label:"OK，安排见面", next:"FOLLOWUP_SERVICE"}
    ]
  },
  CALLBACK:{terminal:true, icon:"📞", color:"var(--amber)", title:"稍后回拨", note:"按约定时间回拨，重新从开场开始。"},
  FOLLOWUP_SERVICE:{terminal:true, icon:"📋", color:"var(--green)", title:"已表达服务兴趣，待跟进", note:"把号码save起来，告知你的名字，后续安排同事联系客户 / 安排见面。"},
  SOFT_CLOSE:{terminal:true, icon:"📬", color:"var(--amber)", title:"暂时不需要，已存号码", note:"客户已把你的号码存起来，之后有新课程 / 消息再通知。"}
};

const nodeFaqs = {
  OPEN:[
    {q:"你哪里拿到我的号码的？", a:"我们这里有你之前上过课 / 询问过我们服务的记录，所以才联系你的哦。"},
    {q:"找我什么事？", a:"就是想跟你follow up一下，看你现在有没有需要我们帮到你的地方，很快而已。"}
  ],
  RECONNECT:[
    {q:"我什么时候有找过你们？", a:"我们这里的记录显示你之前有inquiry过 / 上过我们的课，所以特地打来看看有没有帮到你。"},
    {q:"是不是要跟我收钱 / 续费？", a:"不是的，纯粹是想update你一下我们最新的免费课程和服务，看适不适合你现在的需求。"}
  ],
  COURSE_PITCH:[
    {q:"这两个课程要收费吗？", a:"不用，是免费的线上Zoom课程，Datin Shin亲自分享。"},
    {q:"几时上，要多久？", a:"看你报名的是哪一堂，都是几个小时的线上分享，我盖了电话会把详细时间发给你。"}
  ],
  COURSE_PITCH_CONFIRM:[
    {q:"两个课程都要报名吗？", a:"看你自己的需求，你可以只选一个，也可以两个都上。"}
  ],
  COURSE_REGISTER:[
    {q:"报名后需要付款吗？", a:"不需要，是免费的，我只需要核实你的公司名和email，方便发确认信给你。"},
    {q:"不能出席怎么办？", a:"没关系，到时如果真的不方便，提前跟我说，我再帮你安排。"}
  ],
  SERVICE_PITCH:[
    {q:"服务收费怎样算？", a:"看你需要的service范围，我可以先安排同事跟你见面 / 线上讲解报价，会比较清楚。"},
    {q:"一定要买服务吗？", a:"不是的，我们先了解你的需求，你可以自己决定要不要用。"},
    {q:"SST是什么？", a:"SST是Sales and Service Tax（销售与服务税）要代收再每两个月缴给Custom的<br><br>Sales Tax 10% 是manufacturing 和如果是做Food 的central kitchen需要charge 的<br><br>Service Tax 8% / 6% 是给提供；服务的，做construction的，就连收租金也会需要charge Service Tax的<br><br>*如果客户再问很多，直接讲让我们的同事处理"},
    {q:"Stamp Duty是什么？", a:"Stamp Duty（印花税）是任何签署合同agreement、legal documents文件、买卖产业等 甚至连NDA 都需要做Self assessment （自己算的方式）来给duty。<br><br>*我们有提供2 种的协助<br><br>1. 我们有课程（Public Class 的就是和别人一起上课）另外就是（In House Training 专门针对你们的公司有的状况加入进课堂里面） 都可以Full claim HRDF 的 *(if they want, send your link to register for them)<br><br>2. 我们有提供Stamp Duty Healthcheck 或者Stamp duty impact study帮你们研究到底公司有没有漏了什么agreement或这流程里面没有多到stamping，或者其实你自己都不懂自己算的stamp duty有对吗<br><br>*所以我们都可以帮你，我让我同事联系你要吗？了解先也可以的。"},
    {q:"Einvoice是什么？", a:"Einvoice（电子发票）是LHDN要求公司采用的电子开票系统（不是单纯的PDF Invoice），是要向LHDN Live 申报公司的Sales/purchase啊<br><br>当然如果公司是1mill 以下可以exemption（不需要实行）但是如果公司有其他的关联公司（Direct Shareholding）就很大影响了<br><br>*我们有提供2 种的协助<br><br>1. 我们有课程（Public Class 的就是和别人一起上课）另外就是（In House Training 专门针对你们的公司有的状况加入进课堂里面） 都可以Full claim HRDF 的 *(if they want, send your link to register for them)<br><br>2. 我们有提供Einvoice Healthcheck 或者 Einvoice impact study帮你们研究到底公司有没有漏了什么程序 比方说不应该做Self billed 的 但一直以为可以等等<br><br>*所以我们都可以帮你，我让我同事联系你要吗？了解先也可以的。"}
  ],
  TAX_FOLLOWUP:[
    {q:"SST / Stamp Duty / Einvoice这些课程要收费吗？", a:"看是哪一个课程，有些是免费分享会，有些是收费的实体工作坊，到时同事见面会详细跟你解释。"}
  ]
};

let currentNodeId = "OPEN";
let handlingResponse = null;
let history = [];
let transcript = [];

function enterNode(id){
  const rawNode = nodes[id];
  if(rawNode.terminal){
    transcript.push({type:"terminal", icon:rawNode.icon, color:rawNode.color, title:rawNode.title, note:rawNode.note});
    return;
  }
  transcript.push({type:"script", html:rawNode.script});
}

function snapshot(){
  return {
    currentNodeId: currentNodeId,
    handlingResponse: handlingResponse ? {...handlingResponse} : null,
    transcriptLen: transcript.length
  };
}
function pushHistory(){ history.push(snapshot()); }

function goBack(){
  if(history.length === 0) return;
  const prev = history.pop();
  currentNodeId = prev.currentNodeId;
  handlingResponse = prev.handlingResponse;
  transcript = transcript.slice(0, prev.transcriptLen);
  render();
}

function restart(){
  currentNodeId = "OPEN";
  handlingResponse = null;
  history = [];
  transcript = [];
  enterNode(currentNodeId);
  render();
}

function pickResponse(idx){
  const node = nodes[currentNodeId];
  const resp = node.responses[idx];
  pushHistory();
  transcript.push({type:"client", text:resp.label});
  if(resp.handling){
    handlingResponse = resp;
    transcript.push({type:"handling", html:resp.handling});
  } else {
    currentNodeId = resp.next;
    handlingResponse = null;
    enterNode(currentNodeId);
  }
  render();
}

function continueAfterHandling(){
  pushHistory();
  currentNodeId = handlingResponse.next;
  handlingResponse = null;
  enterNode(currentNodeId);
  render();
}

function renderQuickWrap(){
  const toggle = document.getElementById('quickToggleInline');
  const list = document.getElementById('quickList');
  list.classList.remove('open');
  list.innerHTML = '';
  const faqs = nodeFaqs[currentNodeId];
  if(!faqs || !faqs.length){
    toggle.style.display = 'none';
    return;
  }
  toggle.style.display = '';
  list.innerHTML = faqs.map(f => `<div class="quick-item"><div class="q">${f.q}</div><div class="a">${f.a}</div></div>`).join('');
}

function renderTranscript(){
  const el = document.getElementById('transcript');
  el.innerHTML = transcript.map(t => {
    if(t.type === "script" || t.type === "handling"){
      return `<div class="t-row out"><div class="t-bubble script">${t.html}</div></div>`;
    }
    if(t.type === "client"){
      return `<div class="t-row in"><div class="t-bubble client">${t.text}</div></div>`;
    }
    if(t.type === "terminal"){
      return `
        <div class="t-terminal">
          <div class="terminal-icon" style="color:${t.color}">${t.icon}</div>
          <div class="terminal-title" style="color:${t.color}">${t.title}</div>
          <div class="terminal-note">${t.note}</div>
        </div>
      `;
    }
    return '';
  }).join('');
}

function render(){
  const rawNode = nodes[currentNodeId];
  const liveZone = document.getElementById('liveZone');
  const backRow = document.getElementById('backRow');
  backRow.innerHTML = history.length > 0 ? `<div class="back-link" onclick="goBack()">← 上一题</div>` : '';
  renderTranscript();
  renderQuickWrap();

  if(rawNode.terminal){
    liveZone.innerHTML = '';
    return;
  }

  const stepTag = `<span class="step-tag">Step ${rawNode.step} / ${TOTAL_STEPS}</span>`;

  if(handlingResponse){
    liveZone.innerHTML = `<button class="continue-btn" onclick="continueAfterHandling()">继续 → 下一步</button>`;
    return;
  }

  let buttonsHtml = '';
  rawNode.responses.forEach((r, i) => {
    const acceptClass = r.handling ? '' : 'accept';
    buttonsHtml += `<button class="resp-btn ${acceptClass}" onclick="pickResponse(${i})">${r.label}</button>`;
  });

  liveZone.innerHTML = `
    <div class="resp-label">客户的回应（点击对应选项）：${stepTag}</div>
    <div class="resp-wrap">${buttonsHtml}</div>
  `;
}

function toggleQuick(){
  document.getElementById('quickList').classList.toggle('open');
}

enterNode(currentNodeId);
render();
</script>
</body>
</html>
