<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YYC Webinar邀约电话助手</title>
<style>
  :root{
    --navy:#1d3f72;
    --navy-dark:#16305a;
    --blue-soft:#eaf2fc;
    --blue-text:#1d3f72;
    --gray-bg:#eef1f5;
    --border:#e3e7ee;
    --text:#1f2430;
    --sub:#6b7386;
    --green:#1f9d55;
    --amber:#b9860a;
    --red:#c23b3b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:30px 14px 60px;
    background:#dde3ec;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(20,30,60,.18);
  }
  .header{
    background:linear-gradient(135deg,var(--navy),var(--navy-dark));
    color:#fff;
    padding:20px 20px 18px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .header h1{
    margin:0;
    font-size:18px;
    line-height:1.3;
    font-weight:800;
  }
  .header h1 .h1-sub{
    display:block;
    font-size:11.5px;
    font-weight:600;
    color:#c9d6ea;
    margin-top:4px;
  }
  .header .tag{
    text-align:right;
    font-size:11.5px;
    color:#c9d6ea;
    line-height:1.5;
    white-space:nowrap;
    padding-top:2px;
  }
  .progress-bar{
    background:var(--gray-bg);
    padding:12px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .progress-label{
    font-size:12px;
    font-weight:700;
    color:#555b6b;
    white-space:nowrap;
  }
  .dots{
    display:flex;
    gap:4px;
    flex:1;
    justify-content:flex-end;
    flex-wrap:wrap;
  }
  .dot{
    width:19px;height:19px;border-radius:50%;
    background:#fff;border:2px solid #ccd3de;
    color:#99a0b0;
    font-size:9.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s ease;
    flex:0 0 auto;
  }
  .dot.done{background:var(--navy);border-color:var(--navy);color:#fff;}
  .dot.current{background:#fff;border-color:var(--navy);color:var(--navy);box-shadow:0 0 0 3px rgba(29,63,114,.15);}

  .content{padding:22px 20px 6px;}
  .section-label{
    font-size:12px;
    font-weight:800;
    color:#3b6ea5;
    letter-spacing:.5px;
    margin-bottom:10px;
    text-transform:uppercase;
  }
  .role-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:11.5px;
    font-weight:700;
    color:var(--navy);
    background:var(--blue-soft);
    border:1px solid #cfe0f5;
    border-radius:20px;
    padding:4px 10px;
    margin-bottom:14px;
  }
  .role-badge .switch{
    color:#8990a1;
    text-decoration:underline;
    cursor:pointer;
    font-weight:600;
  }
  .role-pick-title{
    font-size:14.5px;
    font-weight:700;
    color:#242a38;
    margin-bottom:14px;
  }
  .role-btn{
    width:100%;
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:16px;
    margin-bottom:10px;
    font-size:14.5px;
    font-weight:700;
    color:#242a38;
    cursor:pointer;
    text-align:left;
  }
  .role-btn:hover{border-color:var(--navy);background:#f6f9fd;}

  .script-box{
    background:var(--blue-soft);
    border-left:4px solid var(--navy);
    border-radius:10px;
    padding:16px 18px;
    font-size:15px;
    line-height:1.65;
    color:#24314d;
    margin-bottom:20px;
  }
  .script-box b{color:var(--navy);}
  .resp-label{
    font-size:11.5px;
    font-weight:800;
    color:#8990a1;
    letter-spacing:.4px;
    margin-bottom:10px;
    text-transform:uppercase;
  }
  .resp-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    font-size:14.5px;
    font-weight:700;
    color:#242a38;
    cursor:pointer;
    text-align:left;
    transition:border-color .15s ease, background .15s ease;
  }
  .resp-btn:hover{border-color:var(--navy);background:#f6f9fd;}
  .resp-btn .arrow{color:#a9b0bd;font-size:16px;flex:0 0 auto;}
  .resp-btn.accept{border-color:#bfe3cc;}
  .resp-btn.accept:hover{border-color:var(--green);}

  .client-said{
    font-size:12.5px;
    color:var(--sub);
    margin-bottom:10px;
  }
  .client-said b{color:#3a4152;}
  .continue-btn{
    width:100%;
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:14px 16px;
    font-size:14.5px;
    font-weight:800;
    cursor:pointer;
    margin-top:6px;
  }
  .continue-btn:hover{background:var(--navy-dark);}

  .terminal-icon{font-size:34px;text-align:center;margin-bottom:6px;}
  .terminal-title{
    text-align:center;
    font-size:16.5px;
    font-weight:800;
    margin-bottom:8px;
  }
  .terminal-note{
    text-align:center;
    font-size:13px;
    color:var(--sub);
    line-height:1.6;
    margin-bottom:6px;
  }

  .restart{
    text-align:center;
    padding:14px 0 4px;
    font-size:12.5px;
    color:#8990a1;
    cursor:pointer;
  }
  .restart:hover{color:var(--navy);}

  .divider{height:1px;background:var(--border);margin:6px 20px 0;}

  .quick-wrap{padding:14px 20px 22px;}
  .quick-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    font-size:13px;
    font-weight:800;
    color:#8a6400;
    padding:6px 2px;
  }
  .quick-toggle .chev{transition:transform .2s ease; color:#b9860a;}
  .quick-toggle.open .chev{transform:rotate(90deg);}
  .quick-list{
    max-height:0;
    overflow:hidden;
    transition:max-height .4s ease;
  }
  .quick-list.open{max-height:3000px;}
  .quick-item{
    background:#fffaf0;
    border:1px solid #f3e3bd;
    border-radius:10px;
    padding:10px 12px;
    margin-top:8px;
    font-size:13px;
    line-height:1.6;
  }
  .quick-item .q{font-weight:800;color:#5a4200;margin-bottom:4px;}
  .quick-item .a{color:#4a4636;}

  .back-row{padding:0 20px;min-height:22px;}
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:12.5px;
    font-weight:700;
    color:#5b6b8c;
    cursor:pointer;
    padding:8px 0 0;
  }
  .back-link:hover{color:var(--navy);}

  .missing-note{
    background:#fff3cd;
    border:1px dashed #e0b400;
    border-radius:10px;
    padding:10px 12px;
    font-size:12px;
    color:#7a5c00;
    margin-bottom:16px;
    line-height:1.6;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>传承与买卖M&A / 现金流管理<span class="h1-sub">*Webinar Direct Invitation Calling Script</span></h1>
    <div class="tag">老客户<br>Webinar邀约</div>
  </div>

  <div class="progress-bar">
    <div class="progress-label" id="progressLabel">Step 1 / 5</div>
    <div class="dots" id="dots"></div>
  </div>

  <div class="back-row" id="backRow"></div>

  <div class="content" id="content"></div>

  <div class="restart" onclick="restart()">↺ 重新开始 Restart Call Script</div>
  <div class="divider"></div>

  <div class="quick-wrap" id="quickWrap" style="display:none;"></div>
</div>

<script>
const TOTAL_STEPS = 5;

const nodes = {
  OPEN:{
    step:1,
    section:"开场破冰",
    script:`Hi Boss，我是<b>[您的名字]</b> from YYC，请问你方便讲电话吗？`,
    responses:[
      {label:"Yes", next:"SUCCESSION_Q"},
      {label:"No", handling:"方便大概几点打回给你？", next:"CALLBACK"}
    ]
  },
  SUCCESSION_Q:{
    step:2,
    section:"了解传承规划意向",
    script:`因为你最近都很久没有上我们的课了，所以今天打给你看下你对我们的2个课程关于「传承与买卖M&A」和「现金流管理」的课程都是线上的。<br><br>想请问你有没有想过，未来如果有一天想退休、传承，甚至把公司卖出去，您的公司现在有人愿意接手吗？`,
    responses:[
      {label:"继续", next:"IDENTITY"}
    ]
  },
  IDENTITY:{
    step:3,
    section:"确认客户身份",
    needsRole:true,
    rolePrompt:`请问你是公司的（身份）？`,
    variants:{
      boss:{
        script:`（根据客户刚刚的回应判断身份）`,
        responses:[
          {label:"我没有想到，还是对的时机", handling:"其实很多老板都是这样，以为公司赚钱就有价值，但真正到了想传承、找投资者或卖公司的时候，才发现公司没有吸引力，甚至没人愿意接。所以公司除了赚钱，更重要的是把企业做得值钱、做得有价值。（客户常回应：所以咧？没有直接回答——不用纠结，直接带入下一步）", next:"PITCH"}
        ]
      },
      accountant:{
        script:`（根据客户刚刚的回应判断身份）`,
        responses:[
          {label:"我不是老板", handling:"啊明白，那可以问下公司的老板是属于第一代吗？还是第二代已经进来了公司呢？", next:"PITCH"}
        ]
      }
    }
  },
  PITCH:{
    step:4,
    section:"两堂体验课推荐",
    script:`我们的两堂的《传承与买卖公司》和《现金流管理》体验课，Datin Shin会分享很多老板都会遇到的问题，比如：<br>✅ 8个步骤教您如何把公司做得有价值。<br>✅ 股权怎么分，才不会失去控制权？<br><br>就算暂时没想法要找investor或卖公司，先了解清楚自己的cash flow，学到的东西以后一定用得上，完全不会浪费。比如：<br>✅ 用真实cash flow谈valuation，不被低估<br>✅ 我们教你怎样算公司的现金流状况<br><br>是在线上Zoom的哦，而且是免费的，帮你报名OK吗？`,
    responses:[
      {label:"OK，几时？", next:"REGISTER"}
    ]
  },
  REGISTER:{
    step:5,
    section:"完成报名资料",
    script:`我们的《传承与买卖公司》是在<b>(X)月（X)日 下午2pm</b>。「现金流管理」是在<b>(X)月（X)日 晚上 X pm</b>。我需要你的资料完成报名哦。<br><br>公司名字：<i>跟客户核对显示的公司名称</i><br>Email address：<i>跟客户核对是否已有，没有的话现在问</i>`,
    responses:[
      {label:"资料确认，完成登记", next:"DONE"}
    ]
  },
  CALLBACK:{terminal:true, icon:"📞", color:"var(--amber)", title:"稍后回拨", note:"按约定时间回拨，重新从开场开始。"},
  DONE:{terminal:true, icon:"📧", color:"var(--green)", title:"已完成报名，待发送Confirmation", note:"挂电话后马上发送两堂课的confirmation details，并把号码save起来。"}
};

const nodeFaqs = {};

let currentNodeId = "OPEN";
let handlingResponse = null;
let clientRole = null;
let history = [];

function snapshot(){
  return {
    currentNodeId: currentNodeId,
    handlingResponse: handlingResponse ? {...handlingResponse} : null,
    clientRole: clientRole
  };
}
function pushHistory(){ history.push(snapshot()); }

function goBack(){
  if(history.length === 0) return;
  const prev = history.pop();
  currentNodeId = prev.currentNodeId;
  handlingResponse = prev.handlingResponse;
  clientRole = prev.clientRole;
  render();
}

function restart(){
  currentNodeId = "OPEN";
  handlingResponse = null;
  clientRole = null;
  history = [];
  render();
}

function pickRole(role){
  pushHistory();
  clientRole = role;
  render();
}

function switchRole(){
  pushHistory();
  clientRole = null;
  render();
}

function pickResponse(idx){
  const node = getEffectiveNode();
  const resp = node.responses[idx];
  pushHistory();
  if(resp.handling){
    handlingResponse = resp;
    render();
  } else {
    currentNodeId = resp.next;
    handlingResponse = null;
    render();
  }
}

function continueAfterHandling(){
  pushHistory();
  currentNodeId = handlingResponse.next;
  handlingResponse = null;
  render();
}

function getEffectiveNode(){
  const node = nodes[currentNodeId];
  if(node.needsRole && clientRole){
    const variant = node.variants[clientRole];
    return {
      ...node,
      script: variant.script,
      responses: variant.responses || node.responses
    };
  }
  return node;
}

function renderDots(step){
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';
  for(let i=1;i<=TOTAL_STEPS;i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i < step ? ' done' : (i === step ? ' current' : ''));
    d.textContent = i;
    dotsEl.appendChild(d);
  }
}

function renderQuickWrap(){
  const wrap = document.getElementById('quickWrap');
  const faqs = nodeFaqs[currentNodeId];
  if(!faqs || !faqs.length){
    wrap.style.display = 'none';
    wrap.innerHTML = '';
    return;
  }
  wrap.style.display = '';
  const itemsHtml = faqs.map(f => `<div class="quick-item"><div class="q">${f.q}</div><div class="a">${f.a}</div></div>`).join('');
  wrap.innerHTML = `
    <div class="quick-toggle" id="quickToggle" onclick="toggleQuick()">
      <span>⚡ 这一步的快速拒绝 / 常见问题</span>
      <span class="chev">▶</span>
    </div>
    <div class="quick-list" id="quickList">${itemsHtml}</div>
  `;
}

function render(){
  const rawNode = nodes[currentNodeId];
  const content = document.getElementById('content');
  const progressLabel = document.getElementById('progressLabel');
  const backRow = document.getElementById('backRow');
  backRow.innerHTML = history.length > 0 ? `<div class="back-link" onclick="goBack()">← 上一题</div>` : '';
  renderQuickWrap();

  if(rawNode.terminal){
    progressLabel.textContent = "完成";
    renderDots(TOTAL_STEPS + 1);
    content.innerHTML = `
      <div class="terminal-icon" style="color:${rawNode.color}">${rawNode.icon}</div>
      <div class="terminal-title" style="color:${rawNode.color}">${rawNode.title}</div>
      <div class="terminal-note">${rawNode.note}</div>
    `;
    return;
  }

  progressLabel.textContent = "Step " + rawNode.step + " / " + TOTAL_STEPS;
  renderDots(rawNode.step);

  if(rawNode.needsRole && !clientRole){
    const promptHtml = rawNode.rolePrompt
      ? `<div class="script-box">${rawNode.rolePrompt}</div><div class="resp-label">客户的回应（点击对应选项）：</div>`
      : `<div class="role-pick-title">这通电话对方的身份是？</div>`;
    content.innerHTML = `
      <div class="section-label">${rawNode.section}</div>
      ${promptHtml}
      <button class="role-btn" onclick="pickRole('boss')">👔 老板 / 公司决策人</button>
      <button class="role-btn" onclick="pickRole('accountant')">🧾 Accountant / 财务负责人</button>
    `;
    return;
  }

  const node = getEffectiveNode();

  if(handlingResponse){
    content.innerHTML = `
      <div class="section-label">${node.section}</div>
      ${rawNode.needsRole ? `<div class="role-badge">${clientRole==='boss' ? '👔 老板' : '🧾 Accountant'} <span class="switch" onclick="switchRole()">切换身份</span></div>` : ''}
      <div class="client-said">客户说：<b>"${handlingResponse.label}"</b></div>
      <div class="script-box">${handlingResponse.handling}</div>
      <button class="continue-btn" onclick="continueAfterHandling()">继续 → 下一步</button>
    `;
    return;
  }

  let buttonsHtml = '';
  node.responses.forEach((r, i) => {
    const acceptClass = r.handling ? '' : 'accept';
    buttonsHtml += `<button class="resp-btn ${acceptClass}" onclick="pickResponse(${i})"><span>${r.label}</span><span class="arrow">→</span></button>`;
  });

  content.innerHTML = `
    <div class="section-label">${node.section}</div>
    ${rawNode.needsRole ? `<div class="role-badge">${clientRole==='boss' ? '👔 老板' : '🧾 Accountant'} <span class="switch" onclick="switchRole()">切换身份</span></div>` : ''}
    <div class="script-box">${node.script}</div>
    <div class="resp-label">客户的回应（点击对应选项）：</div>
    ${buttonsHtml}
  `;
}

function toggleQuick(){
  document.getElementById('quickToggle').classList.toggle('open');
  document.getElementById('quickList').classList.toggle('open');
}

render();
</script>
</body>
</html>
