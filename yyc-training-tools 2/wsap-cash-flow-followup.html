<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YYC 现金流 Follow-up Call Assistant</title>
<style>
  :root{
    --navy:#1d3f72;
    --navy-dark:#16305a;
    --blue-soft:#eaf2fc;
    --blue-text:#1d3f72;
    --gray-bg:#eef1f5;
    --border:#e3e7ee;
    --text:#1f2430;
    --sub:#6b7386;
    --green:#1f9d55;
    --amber:#b9860a;
    --red:#c23b3b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:30px 14px 60px;
    background:#dde3ec;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(20,30,60,.18);
  }
  .header{
    background:linear-gradient(135deg,var(--navy),var(--navy-dark));
    color:#fff;
    padding:20px 20px 18px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .header h1{
    margin:0;
    font-size:23px;
    line-height:1.3;
    font-weight:800;
  }
  .header h1 .h1-sub{
    display:block;
    font-size:13px;
    font-weight:600;
    color:#c9d6ea;
    margin-top:5px;
  }
  .header .tag{
    text-align:right;
    font-size:13px;
    color:#c9d6ea;
    line-height:1.5;
    white-space:nowrap;
    padding-top:2px;
  }
  .track-bar{
    background:var(--gray-bg);
    padding:14px 20px 16px;
  }
  .track-label{
    font-size:12px;
    font-weight:800;
    color:#8a93a3;
    letter-spacing:.5px;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .track-row{display:flex;gap:10px;}
  .track-card{
    flex:1;
    background:transparent;
    color:#8a93a3;
    font-size:14px;
    font-weight:700;
    text-align:center;
    line-height:1.4;
    padding:14px 10px;
    border-radius:12px;
    cursor:default;
  }
  .track-card.active{
    background:#fff;
    color:var(--navy);
    box-shadow:0 2px 8px rgba(20,30,60,.10);
  }

  .content{padding:0;}

  .transcript{
    padding:20px 20px 6px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .t-row{display:flex;}
  .t-row.out{justify-content:flex-end;}
  .t-row.in{justify-content:flex-start;}
  .t-bubble{
    max-width:82%;
    padding:14px 18px;
    border-radius:14px;
    font-size:15.5px;
    line-height:1.65;
  }
  .t-bubble.script{
    background:linear-gradient(135deg,var(--navy),var(--navy-dark));
    color:#fff;
  }
  .t-bubble.script b{color:#ffd76a;}
  .t-bubble.client{
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:24px;
    color:#242a38;
    font-weight:700;
    font-size:14.5px;
    padding:12px 18px;
  }
  .t-bubble.role{
    background:#fff;
    border:1.5px solid #cfe0f5;
    color:var(--navy);
    border-radius:24px;
    font-weight:700;
    font-size:13.5px;
    padding:10px 16px;
  }
  .t-terminal{padding:8px 6px 4px;}

  .live-zone{padding:4px 20px 4px;}
  .role-pick-title{
    font-size:16px;
    font-weight:700;
    color:#242a38;
    margin-bottom:16px;
  }
  .role-btn{
    width:100%;
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:14px;
    padding:17px;
    margin-bottom:10px;
    font-size:15.5px;
    font-weight:700;
    color:#242a38;
    cursor:pointer;
    text-align:left;
  }
  .role-btn:hover{border-color:var(--navy);background:#f6f9fd;}

  .resp-label{
    font-size:12.5px;
    font-weight:800;
    color:#8990a1;
    letter-spacing:.4px;
    margin-bottom:12px;
    text-transform:uppercase;
  }
  .resp-label .step-tag{
    color:#a9b0bd;
    font-weight:700;
    text-transform:none;
    letter-spacing:0;
    margin-left:6px;
  }
  .resp-wrap{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:6px;
  }
  .resp-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    border:1.5px solid var(--border);
    border-radius:24px;
    padding:13px 20px;
    font-size:15.5px;
    font-weight:700;
    color:#242a38;
    cursor:pointer;
    text-align:center;
    line-height:1.4;
    transition:border-color .15s ease, background .15s ease;
  }
  .resp-btn:hover{border-color:var(--navy);background:#f6f9fd;}
  .resp-btn.accept{border-color:#bfe3cc;}
  .resp-btn.accept:hover{border-color:var(--green);}

  .continue-btn{
    width:100%;
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:16px 18px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    margin-top:8px;
  }
  .continue-btn:hover{background:var(--navy-dark);}

  .terminal-icon{font-size:40px;text-align:center;margin-bottom:8px;}
  .terminal-title{
    text-align:center;
    font-size:19px;
    font-weight:800;
    margin-bottom:10px;
  }
  .terminal-note{
    text-align:center;
    font-size:14.5px;
    color:var(--sub);
    line-height:1.65;
    margin-bottom:6px;
  }

  .bottom-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:16px 20px 18px;
    border-top:1px solid var(--border);
    margin-top:10px;
  }
  .quick-toggle-inline{
    font-size:13.5px;
    font-weight:800;
    color:#8a6400;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .quick-toggle-inline:hover{color:#b9860a;}
  .restart-inline{
    text-align:right;
    font-size:13.5px;
    font-weight:700;
    color:#8990a1;
    cursor:pointer;
  }
  .restart-inline:hover{color:var(--navy);}

  .quick-list{
    max-height:0;
    overflow:hidden;
    transition:max-height .4s ease;
    padding:0 20px;
  }
  .quick-list.open{max-height:3000px;padding-bottom:16px;}
  .quick-item{
    background:#fffaf0;
    border:1px solid #f3e3bd;
    border-radius:10px;
    padding:12px 14px;
    margin-top:8px;
    font-size:14px;
    line-height:1.6;
  }
  .quick-item .q{font-weight:800;color:#5a4200;margin-bottom:4px;}
  .quick-item .a{color:#4a4636;}

  .back-row{padding:0 20px;min-height:22px;}
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:12.5px;
    font-weight:700;
    color:#5b6b8c;
    cursor:pointer;
    padding:8px 0 0;
  }
  .back-link:hover{color:var(--navy);}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>WSAP：CASH Flow Management<span class="h1-sub">*WSAP Post Event Calling Script</span></h1>
    <div class="tag">分享会学员<br>邀约面谈流程</div>
  </div>

  <div class="track-bar">
    <div class="track-label">选择内容 / TRACK</div>
    <div class="track-row">
      <div class="track-card active">现金流<br><b>Follow-up</b></div>
      <div class="track-card">传承与买卖<br><b>M&amp;A</b></div>
    </div>
  </div>

  <div class="content" id="content">
    <div class="transcript" id="transcript"></div>
    <div class="back-row" id="backRow"></div>
    <div class="live-zone" id="liveZone"></div>
  </div>

  <div class="quick-list" id="quickList"></div>

  <div class="bottom-bar">
    <div class="quick-toggle-inline" id="quickToggleInline" onclick="toggleQuick()" style="display:none;">⚡ 快速问答</div>
    <div class="restart-inline" onclick="restart()">↺ 重新开始</div>
  </div>
</div>

<script>
const TOTAL_STEPS = 10;

const nodes = {
  L1:{
    step:1,
    section:"L1 · 开场破冰",
    script:`xx你好，我是<b>[您的名字]</b> from YYC。请问你方便讲电话吗？（只需要5分钟而已）`,
    responses:[
      {label:"可以 / 什么事 / 做么咧", next:"L2"},
      {label:"不方便", handling:"没事，我等下<b>[XX点]</b>打回你，可以吗？", next:"CALLBACK"},
      {label:"你哪里拿到我号码的？", handling:"是因为你有报名参加DATIN SHIN的【现金流】分享会，所以才联系你的哦", next:"L2"},
      {label:"没有接 / 挂断", next:"WHATSAPP_FOLLOWUP"}
    ]
  },
  L2:{
    step:2,
    section:"L2 · 确认出席分享会",
    script:`谢谢你昨天有参加我DATIN SHIN的【现金流】分享会，请问你昨天有上完吗？`,
    responses:[
      {label:"有，上到大概3点多4点 / 上完", next:"CT"},
      {label:"有，但是进了一下而已", handling:"还好还好，至少有来看一下！那我们接着聊。", next:"CT"},
      {label:"没上完 / 上到一半 / 迟进去", handling:"啊，你昨天逃课啊？哈哈哈哈（<b>语气一定要放软、降低</b>）", next:"CT"},
      {label:"没有参加到（追问为什么）", handling:"哦是这样啊，那方便问一下是什么原因没参加到呢？没关系的。", next:"L4_NOSHOW"}
    ]
  },
  CT:{
    step:3,
    section:"公司年资",
    script:`那公司做了多久了？（聆听；写下）`,
    responses:[
      {label:"多过30年", handling:"追问：是第一代还是第二代？（聆听）", next:"CT_REV"},
      {label:"愿意大概讲而已", handling:"追问：是不是老板？", next:"CT_REV"},
      {label:"不愿意讲 / 不是老板", next:"CT_REV"}
    ]
  },
  CT_REV:{
    step:4,
    section:"生意额 / Revenue",
    script:`那生意额/Revenue大概是多少呢？（聆听；写下）`,
    responses:[
      {label:"记录，继续", next:"L3"}
    ]
  },
  L3:{
    step:5,
    section:"L3 · 了解公司行业",
    script:`可以了解一下你的公司是做什么生意的？（聆听，如果没有说才追问）请问是做：`,
    responses:[
      {label:"Manufacturing", next:"L4"},
      {label:"Trading贸易 / Wholesales批发 / Retails零售店", next:"L4"},
      {label:"F&B 餐饮业", next:"L4"},
      {label:"Construction建筑 / Developer地产开发商", next:"L4"},
      {label:"还是什么呢？ / 不愿意说", handling:"没事没事，大概了解就好。", next:"L4"}
    ]
  },
  L4:{
    step:6,
    section:"L4 · 报名动机",
    script:`那你报名我们的分享会 有得到 / 找到你要的答案吗？`,
    responses:[
      {label:"有说出诉求 / 愿意分享", next:"L5"},
      {label:"只是想要上课而已", next:"L5"},
      {label:"我不是老板", handling:"追问：那你负责什么？", next:"L5"}
    ]
  },
  L5:{
    step:7,
    section:"L5 · 1–10分打分",
    script:`那老板，如果需要你打分，1分到10分，你会打多少分呢？`,
    responses:[
      {label:"Rate ＞ 6", next:"L6"},
      {label:"Rate ≤ 6", handling:"哦老板，那我想请教一下，是哪里让你觉得还可以更好的？其实你比较想要直接解决什么问题？还是你会需要我们直接服务你呢？", next:"L6"}
    ]
  },
  L6:{
    step:8,
    section:"L6 · 假设性铺垫（现金流需求）",
    needsRole:true,
    variants:{
      boss:{
        script:`谢谢你啊老板！其实你会上我们「现金流」的课程，我相信你也想要让公司可以更多的资金去周转的。对吗？也许是expansion，也许开始感觉现金有点紧张，或许你想要请人，请人才也需要用到「钱」的啊 对吗？`,
        responses:[
          {label:"认同其中一个假设", next:"L7"},
          {label:"都不是，现金还好", handling:"没事老板，就算暂时不需要，但我们的工具能帮你把现有的现金流进步的更好，不管有没有扩张计划，我相信老板你也想要公司有更多的cash在手。现金流是需要设计的哦，哪怕银行角度还是投资者的角度都很看重的哦。", next:"L7"}
        ]
      },
      accountant:{
        script:`谢谢你啊[Accountant Name]！其实你会上我们「现金流」的课程，我相信你也想要让公司可以更多的资金去周转的。对吗？也许是expansion，也许开始感觉现金有点紧张，或许你想要请人，请人才也需要用到「钱」的啊 对吗？`,
        responses:[
          {label:"认同其中一个假设", next:"L7"},
          {label:"都不是，现金还好", handling:"哇，公司的现金流很强哦，都是你在管理吗？（聆听）其实就算暂时不需要，但我们的工具能帮你把现有的现金流进步的更好，我相信你的老板也想要公司有更多的cash在手，因为「现金流」是需要设计的哦，哪怕是银行角度还是投资者的角度都很看重的哦。", next:"L7"}
        ]
      }
    }
  },
  L7:{
    step:9,
    section:"L7 · CCC / Working Capital",
    needsRole:true,
    variants:{
      boss:{ script:`那老板，昨天有算到自己的CCC和working capital吗？那你满意吗？哈哈哈` },
      accountant:{ script:`那昨天有帮公司算到公司的CCC和working capital吗？那你觉得满意吗？哈哈哈` }
    },
    responses:[
      {label:"有算，但不懂是对的吗 / 大概大概吧", next:"L8"},
      {label:"没有算到 / 不会算 / 没有数据", handling:"没关系，那更加需要我们帮你算清楚。", next:"L8"},
      {label:"满意啊 / 或没直接回答", handling:"满意是好事，那如果可以让这个数字变得更好，你会想知道怎么做到的吗？", next:"L8"}
    ]
  },
  L8:{
    step:10,
    section:"L8 · 约见 + 索取Audited Report",
    script:`那我可以帮你！我可以带你再仔细的算公司的「CCC和working capital」，需要你的audited report和management account而已。这次的consultation session是complimentary/免费的，会在我们的公司Pudu跟我的manager/consultant一起帮你analyse。在这个/下个星期<b>[X] [X点]</b>到我们公司Pudu见，我需要你的audited report/management account哦。最新的是2024/2025的吗？`,
    responses:[
      {label:"同意见面", next:"SUCCESS"},
      {label:"要问伴侣 / 合伙人 / 我考虑一下先", handling:"没问题，那我先帮你留这个时间，如果到时不方便再跟我说。但由于我们的时间有点满，需要你明天confirm哦。", next:"FOLLOWUP"},
      {label:"觉得有距离，不想跑一趟 / 只想线上", handling:"了解，不过当面会比较准确，你也可以当场直接问到想问的。", next:"FOLLOWUP"},
      {label:"下星期没空", handling:"没问题，那你方便的时间大概是？", next:"FOLLOWUP"}
    ]
  },
  L4_NOSHOW:{
    step:6,
    section:"L4 · 报名动机（未出席分支）",
    script:`那你报名我们的分享会是想要解决什么问题？`,
    responses:[
      {label:"钱不够用", next:"L5a"},
      {label:"只是想上课而已", next:"L5b"}
    ]
  },
  L5a:{
    step:7,
    section:"L5a · 了解现金压力",
    script:`（针对钱不够用）其实这个状况多久了？（聆听，写下）方便了解大概公司的「cash reserve」能够顶多少个月呢？`,
    responses:[
      {label:"还好啦 3–6个月", next:"L5c"},
      {label:"不懂咧 / 不清楚", next:"L5c"},
      {label:"怎样算？", next:"L5c"}
    ]
  },
  L5c:{
    step:8,
    section:"L5c · 邀请下一场分享会",
    script:`那我这里可以协助你2个东西。第一：我们下一堂「现金流」分享会 是在<b>（日期）（时间）</b>线上Zoom的，你OK吗？`,
    responses:[
      {label:"OK / 应该可以", handling:"但是我需要你答应我，你一定要记得参加，我会帮你完成报名，我需要你block你的Calendar哦。", next:"L5C_INVITE_OTHERS"},
      {label:"不行哦！", handling:"那我再看几时还有哦，把我号码save起来，我是<b>[XXX]</b>，有需要什么随时联络我。", next:"RESCHEDULE_WEBINAR"}
    ]
  },
  L5C_INVITE_OTHERS:{
    step:8,
    section:"邀请其他人",
    script:`（追问）除了帮你报名，还有谁你也要我邀请他吗？`,
    responses:[
      {label:"记录，继续", next:"MEET_SETUP_NOSHOW"}
    ]
  },
  MEET_SETUP_NOSHOW:{
    step:9,
    section:"安排见面（身份确认）",
    needsRole:true,
    variants:{
      boss:{ script:`第二：你上完了我们的「现金流」课程，我需要你安排见面。`, responses:[{label:"继续", next:"L8a"}] },
      accountant:{ script:`第二：你上完了我们的「现金流」课程，我需要你安排见面。`, responses:[{label:"继续", next:"L8a"}] }
    }
  },
  L8a:{
    step:10,
    section:"L8a · 确认功课 / 安排见面",
    script:`当你上完课程了，我会打给你看你有没有做功课先哦！你没有上课那我就安排不了见面的，因为需要你了解「现金流」我见你的时候才更能和你挂钩关于CASH的Consultation。`,
    responses:[
      {label:"答应 / 有回应", handling:"那把我号码save起来，我是<b>[XXX]</b>，有需要什么随时联络我。", next:"PENDING_COURSE"},
      {label:"再看啦 / 不能confirm，要看当时有没有上到课", handling:"那把我号码save起来，我是<b>[XXX]</b>，有需要什么随时联络我。", next:"PENDING_COURSE"}
    ]
  },
  L5b:{
    step:7,
    section:"L5b · 确认真实需求",
    script:`明白，我相信你的时间也很忙，大概也是想知道怎样能帮公司解决，或者可以怎样再把关好现金流的，对吗？`,
    responses:[
      {label:"认同", next:"L5d"},
      {label:"答案不坚定", next:"L5d"}
    ]
  },
  L5d:{
    step:8,
    section:"L5d · 邀请下一场分享会",
    script:`我们下一堂「现金流」分享会 是在<b>（日期）（时间）</b>线上Zoom的，你OK吗？`,
    responses:[
      {label:"OK / 应该可以", handling:"那把我号码save起来，我是<b>[XXX]</b>，有需要什么随时联络我。", next:"L5D_CALENDAR"},
      {label:"不行哦！", handling:"那我再看几时还有哦，把我号码save起来，我是<b>[XXX]</b>，有需要什么随时联络我。", next:"RESCHEDULE_WEBINAR"}
    ]
  },
  L5D_CALENDAR:{
    step:9,
    section:"确认下场分享会",
    script:`但是我需要你答应我，你一定要记得参加，我会帮你完成报名，我需要你block你的Calendar哦。`,
    responses:[
      {label:"确认，结束通话", next:"FOLLOWUP_NOSHOW"}
    ]
  },
  SUCCESS:{terminal:true, icon:"✅", color:"var(--green)", title:"已确认见面", note:"挂电话后马上发资料清单 + confirmation email，并把号码存起来。"},
  FOLLOWUP:{terminal:true, icon:"📅", color:"var(--amber)", title:"已约定稍后跟进", note:"记得设提醒，按约定时间/明天再确认。"},
  CALLBACK:{terminal:true, icon:"📞", color:"var(--amber)", title:"稍后回拨", note:"按约定时间回拨，可从L2（确认出席分享会）开始。"},
  RESCHEDULE_WEBINAR:{terminal:true, icon:"📆", color:"var(--amber)", title:"改期邀约下堂分享会", note:"这次时间不行，之后再看下一场适合的时间，重新邀约对方。"},
  FOLLOWUP_NOSHOW:{terminal:true, icon:"📅", color:"var(--amber)", title:"已邀约下堂分享会，待跟进", note:"记得帮对方完成下堂分享会报名，提醒对方按时出席、block calendar。"},
  PENDING_COURSE:{terminal:true, icon:"🎓", color:"var(--amber)", title:"待完成课程后安排见面", note:"对方需先完成线上分享会，之后再跟进确认出席状况，才能安排CCC consultation见面。"},
  WHATSAPP_FOLLOWUP:{terminal:true, icon:"📲", color:"var(--red)", title:"未接通 → 发送WhatsApp", note:"发送Unreached WhatsApp消息，简单说明分享会内容 + 邀请预约时间。"}
};

const nodeFaqs = {
  L1:[
    {q:"YYC是什么？做什么的？", a:"我们YYC是一家52年的Accounting Firm。做Audit Tax 还有Business Academy的。"},
    {q:"这通电话要多久？", a:"就5分钟而已，不会耽误你太久。"}
  ],
  L2:[
    {q:"你要卖我东西是吗？", a:"老板，你有需要才买也可以，但最重要要懂你上完课的回馈。"},
    {q:"有录影 / recording可以看吗？", a:"我们的这个4个小时是没有recording的哦。老板你是不是时常想上课但是一边听一边忙呢？"}
  ],
  CT:[
    {q:"为什么要问公司做多久、生意额？", a:"因为这个是基本资料想了解你啊，那我才不会回答错你嘛。"}
  ],
  L3:[
    {q:"我们做好几种生意 / 跨行业呢？", a:"没关系，挑你觉得比重最大的那个说就好。"}
  ],
  L4:[
    {q:"我报名的是什么课啊？", a:"是我们DATIN SHIN亲自教的「现金流」课程啊，教你怎么算公司的CCC和Working Capital的啊。"}
  ],
  L5:[
    {q:"一定要打分吗？", a:"肯定！希望越真实越好。我们才懂怎样可以再能帮到你。"}
  ],
  L6:[
    {q:"怎样才算真正的足够 / 好的现金流？", a:"其实没有说怎样叫足够，但是当你生意额/Revenue在起的时候，反而感觉钱越来越不够的时候咯，或者是公司不要再成长的时候，我相信你肯定要成长的对吗？"}
  ],
  L7:[
    {q:"CCC是什么？", a:"Cash Conversion Cycle，简单说就是你的钱从进货、卖出到收回现金，中间要卡多久。"},
    {q:"Working capital是什么？", a:"就是公司日常营运需要周转的资金。"}
  ],
  L8:[
    {q:"你要会卖我东西是吗？", a:"老板，你有需要才买也可以。最重要我们这次的见面可以先帮你做Analysis，但你需要opened minded哦。"},
    {q:"Consultation session大概要 / 有多久？", a:"大概1到2个小时。但我很肯定这个session和有你的data，你一定能带着至少200千的方向回去执行的。"},
    {q:"地点在哪？", a:"在KL PUDU，我们的总公司。盖了这个电话我会马上发你Confirmation WhatsApp和Checklist给你。"},
    {q:"需要准备什么？", a:"我们需要你最新的Audited report和Management Account。放心，盖了这个电话我会马上发你Confirmation WhatsApp和Checklist给你。"},
    {q:"真的免费吗？", a:"因为你有参加我们的这次分享会才有的，平时我们做这样的consultation session是要收费的（2个小时5千块）。所以老板，你来，我肯定这个session你一定能带着至少200千的方向回去执行的，需要你opened minded，我们才能真正帮到你哦。"},
    {q:"Manager / consultant是谁？", a:"是我们负责帮你分析CCC和working capital的同事，会跟我一起在场。"}
  ]
};

let currentNodeId = "L1";
let handlingResponse = null; // {handling, next, label}
let clientRole = null; // 'boss' | 'accountant'
let history = []; // stack of previous {currentNodeId, handlingResponse, clientRole, transcriptLen}
let transcript = []; // accumulated chat log entries

function getEffectiveNode(id){
  const node = nodes[id];
  if(node.needsRole && clientRole){
    const variant = node.variants[clientRole];
    return {
      ...node,
      script: variant.script,
      responses: variant.responses || node.responses
    };
  }
  return node;
}

function enterNode(id){
  const rawNode = nodes[id];
  if(rawNode.terminal){
    transcript.push({type:"terminal", icon:rawNode.icon, color:rawNode.color, title:rawNode.title, note:rawNode.note});
    return;
  }
  if(rawNode.needsRole && !clientRole){
    transcript.push({type:"roleAsk", text:"这通电话对方的身份是？"});
    return;
  }
  const node = getEffectiveNode(id);
  transcript.push({type:"script", html:node.script});
}

function snapshot(){
  return {
    currentNodeId: currentNodeId,
    handlingResponse: handlingResponse ? {...handlingResponse} : null,
    clientRole: clientRole,
    transcriptLen: transcript.length
  };
}

function pushHistory(){
  history.push(snapshot());
}

function goBack(){
  if(history.length === 0) return;
  const prev = history.pop();
  currentNodeId = prev.currentNodeId;
  handlingResponse = prev.handlingResponse;
  clientRole = prev.clientRole;
  transcript = transcript.slice(0, prev.transcriptLen);
  render();
}

function restart(){
  currentNodeId = "L1";
  handlingResponse = null;
  clientRole = null;
  history = [];
  transcript = [];
  enterNode(currentNodeId);
  render();
}

function pickRole(role){
  pushHistory();
  clientRole = role;
  transcript.push({type:"roleTag", text: role==='boss' ? '👔 老板 / 公司决策人' : '🧾 Accountant / 财务负责人'});
  const node = getEffectiveNode(currentNodeId);
  transcript.push({type:"script", html:node.script});
  render();
}

function switchRole(){
  pushHistory();
  clientRole = null;
  transcript.push({type:"roleAsk", text:"这通电话对方的身份是？（重新选择）"});
  render();
}

function pickResponse(idx){
  const node = getEffectiveNode(currentNodeId);
  const resp = node.responses[idx];
  pushHistory();
  transcript.push({type:"client", text:resp.label});
  if(resp.handling){
    handlingResponse = resp;
    transcript.push({type:"handling", html:resp.handling});
  } else {
    currentNodeId = resp.next;
    handlingResponse = null;
    enterNode(currentNodeId);
  }
  render();
}

function continueAfterHandling(){
  pushHistory();
  currentNodeId = handlingResponse.next;
  handlingResponse = null;
  enterNode(currentNodeId);
  render();
}

function renderQuickWrap(){
  const toggle = document.getElementById('quickToggleInline');
  const list = document.getElementById('quickList');
  list.classList.remove('open');
  list.innerHTML = '';
  const faqs = nodeFaqs[currentNodeId];
  if(!faqs || !faqs.length){
    toggle.style.display = 'none';
    return;
  }
  toggle.style.display = '';
  list.innerHTML = faqs.map(f => `<div class="quick-item"><div class="q">${f.q}</div><div class="a">${f.a}</div></div>`).join('');
}

function renderTranscript(){
  const el = document.getElementById('transcript');
  el.innerHTML = transcript.map(t => {
    if(t.type === "script" || t.type === "handling"){
      return `<div class="t-row out"><div class="t-bubble script">${t.html}</div></div>`;
    }
    if(t.type === "client"){
      return `<div class="t-row in"><div class="t-bubble client">${t.text}</div></div>`;
    }
    if(t.type === "roleAsk"){
      return `<div class="t-row out"><div class="t-bubble script">${t.text}</div></div>`;
    }
    if(t.type === "roleTag"){
      return `<div class="t-row in"><div class="t-bubble role">${t.text}</div></div>`;
    }
    if(t.type === "terminal"){
      return `
        <div class="t-terminal">
          <div class="terminal-icon" style="color:${t.color}">${t.icon}</div>
          <div class="terminal-title" style="color:${t.color}">${t.title}</div>
          <div class="terminal-note">${t.note}</div>
        </div>
      `;
    }
    return '';
  }).join('');
}

function render(){
  const rawNode = nodes[currentNodeId];
  const liveZone = document.getElementById('liveZone');
  const backRow = document.getElementById('backRow');
  backRow.innerHTML = history.length > 0 ? `<div class="back-link" onclick="goBack()">← 上一题</div>` : '';
  renderTranscript();
  renderQuickWrap();

  if(rawNode.terminal){
    liveZone.innerHTML = '';
    return;
  }

  const stepTag = `<span class="step-tag">Step ${rawNode.step} / ${TOTAL_STEPS}</span>`;

  // Role picker gate for L6 / L7
  if(rawNode.needsRole && !clientRole){
    liveZone.innerHTML = `
      <button class="role-btn" onclick="pickRole('boss')">👔 老板 / 公司决策人</button>
      <button class="role-btn" onclick="pickRole('accountant')">🧾 Accountant / 财务负责人</button>
    `;
    return;
  }

  const node = getEffectiveNode(currentNodeId);

  if(handlingResponse){
    liveZone.innerHTML = `<button class="continue-btn" onclick="continueAfterHandling()">继续 → 下一步</button>`;
    return;
  }

  let buttonsHtml = '';
  node.responses.forEach((r, i) => {
    const acceptClass = r.handling ? '' : 'accept';
    buttonsHtml += `<button class="resp-btn ${acceptClass}" onclick="pickResponse(${i})">${r.label}</button>`;
  });

  liveZone.innerHTML = `
    <div class="resp-label">客户的回应（点击对应选项）：${stepTag}</div>
    <div class="resp-wrap">${buttonsHtml}</div>
  `;
}

function toggleQuick(){
  document.getElementById('quickList').classList.toggle('open');
}

enterNode(currentNodeId);
render();
</script>
